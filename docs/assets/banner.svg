<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="LogBot — ein Projekt, vier Repos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000820"/>
      <stop offset="55%" stop-color="#041033"/>
      <stop offset="100%" stop-color="#0a1f4d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <g opacity="0.10" fill="none" stroke="#7dd3fc" stroke-width="1">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200"/>
  </g>

  <g transform="translate(72 84)">
    <rect width="152" height="152" rx="34" fill="#0b1a3f" stroke="#1e3a8a" stroke-width="2"/>
    <g stroke="#38bdf8" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M40 46 H112"/>
      <path d="M40 76 H96"/>
      <path d="M40 106 H84"/>
    </g>
    <circle cx="112" cy="106" r="15" fill="#38bdf8"/>
  </g>

  <g font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="272" y="128" fill="#ffffff" font-size="76" font-weight="700" letter-spacing="2">LogBot</text>
    <text x="276" y="176" fill="#93c5fd" font-size="26" font-weight="400">Zentraler Log-Server für Linux, Windows und Netzwerkgeräte</text>
    <rect x="276" y="196" width="420" height="3" rx="1.5" fill="url(#line)"/>

    <g font-size="20" fill="#cbd5f5">
      <g transform="translate(276 224)">
        <rect width="150" height="44" rx="22" fill="#0b1a3f" stroke="#1e40af" stroke-width="1.5"/>
        <text x="75" y="29" text-anchor="middle" fill="#e0f2fe">Server</text>
      </g>
      <g transform="translate(442 224)">
        <rect width="180" height="44" rx="22" fill="#0b1a3f" stroke="#1e40af" stroke-width="1.5"/>
        <text x="90" y="29" text-anchor="middle" fill="#e0f2fe">Android-App</text>
      </g>
      <g transform="translate(638 224)">
        <rect width="180" height="44" rx="22" fill="#0b1a3f" stroke="#1e40af" stroke-width="1.5"/>
        <text x="90" y="29" text-anchor="middle" fill="#e0f2fe">n8n-Workflows</text>
      </g>
      <g transform="translate(834 224)">
        <rect width="200" height="44" rx="22" fill="#0b1a3f" stroke="#1e40af" stroke-width="1.5"/>
        <text x="100" y="29" text-anchor="middle" fill="#e0f2fe">Diese Übersicht</text>
      </g>
    </g>
